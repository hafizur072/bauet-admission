function check(){ const x=f(), s=parseFloat(CHK.ssc), h=parseFloat(CHK.hssc); if(isNaN(s)||isNaN(h)||s<0||h<0||s>5||h>5) return {t:'mid',m:'Enter both GPAs (0.00 to 5.00) to see the result.'};
 if(CHK.f) return {t:'bad',m:'NOT ELIGIBLE: the notice does not allow an F grade in SSC/Dakhil or HSC/Alim.'};
 const sum=Math.round((s+h)*100)/100, min=Math.min(s,h);
 if(min>=x.minEach) return sum>=x.direct?{t:'ok',m:'ELIGIBLE. Combined GPA '+sum.toFixed(2)+' is '+x.direct+' or more, so you may also qualify for DIRECT ADMISSION through viva-voce right after the circular. Confirm with the BBA hotline.'}:{t:'ok',m:'ELIGIBLE to apply (at least '+x.minEach+' in both exams). Combined GPA '+sum.toFixed(2)+'. You will sit the admission test.'};
 if(min>=x.minOne&&sum>=x.minSum) return {t:'ok',m:'ELIGIBLE to apply: one exam is below '+x.minEach+', but the notice allows it when the combined GPA is at least '+x.minSum+' (yours is '+sum.toFixed(2)+').'};
 return {t:'bad',m:'NOT ELIGIBLE under the '+x.session+' rule. You need at least '+x.minEach+' in both exams, or '+x.minOne+' in one exam with a combined GPA of '+x.minSum+' or more. Your combined GPA is '+sum.toFixed(2)+'. Call the BBA hotline to check special cases.'}; }
function fees(){ const o=FEEOPT, x=f(); let pct=0; if(o.sib) pct+=x.waiverSib; if(o.army) pct+=x.waiverArmy; pct=Math.min(100,pct+Math.min(100,+o.merit||0));
 const flat=o.g?x.waiverG:0, off=Math.round(x.total*pct/100)+flat, net=Math.max(0,x.total-off); return {pct,flat,off,net,per:Math.round(net/x.semesters)}; }

 const gp=[g('as')?'SSC GPA '+g('as'):'',g('ah')?'HSC GPA '+g('ah'):''].filter(Boolean).join(', '), t=`Assalamu alaikum. I am ${n}${g('ap')?' ('+g('ap')+')':''}. Group: ${g('ag')}${gp?', '+gp:''}.\nTopic: ${g('at')}\nQuestion: ${q}\n(BBA admission, ${f().session})`;
 $('#co').innerHTML=`<h3>Your message</h3><div class="msg">${esc(t)}</div><div class="hbtn" style="margin-top:8px"><a class="btn wa" href="${esc(waLink(t))}" ${ext}>Send on WhatsApp</a><button onclick="copyMsg()" class="ghost">Copy for Messenger</button><a class="btn fb" href="${esc(mmLink())}" ${ext}>Open Messenger</a></div><p class="note">Messenger cannot be pre-filled. Copy the message, open Messenger and paste it.</p>`; window._m=t; }
function copyMsg(){ const t=window._m||''; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast('Message copied.'),()=>toast('Could not copy. Select the text and copy it.')); else toast('Select the text above and copy it.'); }

/* ================= admin: PIN, editor, backup, publish ================= */
const newSalt=()=>{ const a=new Uint8Array(8); if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else a.forEach((_,i)=>a[i]=Math.random()*256); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); };
async function hs(p,sl){ const str=sl+':'+p; if(window.crypto&&crypto.subtle&&typeof TextEncoder!=='undefined'){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); } let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return 'f'+(h>>>0).toString(16); }
const pinRec=()=>{ try{return JSON.parse(store.get('bba_pin'));}catch(e){return null;} };
async function pinCreate(){ const a=$('#p1').value, b=$('#p2').value; if(!/^\d{4,8}$/.test(a)) return toast('The PIN must be 4 to 8 digits.'); if(a!==b) return toast('The two PINs do not match.'); const sl=newSalt(); store.set('bba_pin',JSON.stringify({s:sl,h:await hs(a,sl)})); ADMIN_OK=true; toast('PIN created. Write it down: it cannot be recovered.'); render(); }
async function pinTry(){ const r=pinRec(); if(Date.now()<LOCK) return toast('Too many wrong tries. Wait 30 seconds.'); if(await hs($('#pn').value,r.s)!==r.h){ if(++TRIES>=5){ LOCK=Date.now()+30000; TRIES=0; } return toast('Wrong PIN.'); } TRIES=0; ADMIN_OK=true; render(); }
async function pinChange(){ if(!ADMIN_OK) return; const a=$('#n1').value; if(!/^\d{4,8}$/.test(a)) return toast('The PIN must be 4 to 8 digits.'); if(a!==$('#n2').value) return toast('The two PINs do not match.'); const sl=newSalt(); store.set('bba_pin',JSON.stringify({s:sl,h:await hs(a,sl)})); toast('PIN changed.'); }
function lock(){ ADMIN_OK=false; TAB='Home'; render(); }
function need(){ if(!ADMIN_OK) throw new Error('Unlock the Admin area with the PIN first.'); }
const clip=s=>String(s).replace(/[<>]/g,'').trim();
function readField(k,t){ const v=clip($('#af-'+k).value), L=FIELDS_LABEL[k]; const bad=m=>{ throw new Error(L+': '+m); };
 if(t==='date'){ if(!/^\d{4}-\d\d-\d\d$/.test(v)||isNaN(dt(v))) bad('choose a valid date.'); return v; }
 if(t==='time'){ if(!/^\d\d:\d\d$/.test(v)) bad('choose a time.'); return v; }
 if(t==='num'||t==='int'){ const n=Number(v); if(v===''||!isFinite(n)||n<0) bad('enter zero or a positive number.'); if(t==='int'&&(!Number.isInteger(n)||n<1)) bad('enter a whole number, 1 or more.'); return n; }
 if(t==='mmf'){ const u=v.replace(/^https?:\/\/(www\.)?(m\.me|messenger\.com\/t)\//i,'').replace(/\/+$/,''); if(u&&!/^[\w.\-]{3,100}$/.test(u)) bad('enter only the username, for example bauetqadirabad.'); return u; }
 if(t==='phones'){ const p=phones(v); if(!p.length||p.length!==v.replace(/[+()\-]/g,'').split(/[,;\s]+/).filter(Boolean).length) bad('enter phone numbers (10 to 15 digits) separated by commas.'); return p.join(', '); }
 if(t==='email'){ if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) bad('enter a valid email address.'); return v; }
 if(t==='fb'){ if(!okUrl(v)) bad('must start with https://www.facebook.com/'); return v; }
 if(t==='wa'){ const d=v.replace(/\D/g,''); if(d.length<10||d.length>15) bad('use the country code, for example 8801723927317.'); return d; }
 if(t==='https'){ if(!/^https:\/\/[^\s"'<>]+$/i.test(v)) bad('must start with https://'); return v; }
 if(!v||v.length>200) bad('enter 1 to 200 characters.'); return v; }
const FIELDS_LABEL={}; Object.values(FIELDS).forEach(g=>g.forEach(r=>FIELDS_LABEL[r[0]]=r[1]));
function saveFields(g){ try{ need(); const nv={}; FIELDS[g].forEach(r=>nv[r[0]]=readField(r[0],r[2])); const x=Object.assign({},f(),nv); Object.assign(f(),nv); saveD();
  const sum=x.sem1+(x.semesters-1)*x.semRest, ok=Math.abs(sum-x.total)<1; toast('Saved.'+(g==='Dates & Fees'&&!ok?' Check: 1st semester + the other semesters = '+fmt(sum)+', but total tuition is '+fmt(x.total)+'.':'')); }catch(e){ toast(e.message); } render(true); }
function parseList(k,txt){ const [title,,n,numCols]=LISTS[k], rows=[]; txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{ const c=l.split('|').map(x=>clip(x)); if(c.length!==n||c.some(x=>!x)) throw new Error(title+', line '+(i+1)+': use exactly '+n+' parts separated by |.'); numCols.forEach(j=>{ if(!isFinite(+c[j])) throw new Error(title+', line '+(i+1)+': part '+(j+1)+' must be a number.'); }); rows.push(c); }); if(!rows.length) throw new Error(title+': add at least one line.'); return rows; }
function saveLists(){ try{ need(); const out={}; Object.keys(LISTS).forEach(k=>out[k]=parseList(k,$('#al-'+k).value)); Object.assign(D,out); saveD(); const t=D.marks.reduce((s,m)=>s+(+m[1]||0),0); toast('Saved.'+(t!==100?' Note: test marks add up to '+t+', not 100.':'')); }catch(e){ toast(e.message); } render(true); }
function saveText(){ try{ need(); TXF.forEach(([k])=>{ D.tx[k]=clip($('#at-'+k).value); if(k!=='announce'&&!D.tx[k]) throw new Error('This text cannot be empty: '+TXF.find(x=>x[0]===k)[1]); }); saveD(); toast('Saved.'); }catch(e){ toast(e.message); } render(true); }
function collectFaq(){ const out=[]; D.faq.forEach((_,i)=>{ const q=clip($('#fqq'+i).value), a=clip($('#fqa'+i).value); if(!q||!a) throw new Error('FAQ '+(i+1)+': question and answer are both required.'); out.push([q,a]); }); return out; }
function saveFaq(){ try{ need(); D.faq=collectFaq(); saveD(); toast('FAQ saved.'); }catch(e){ toast(e.message); } render(true); }
function faqAdd(){ try{ need(); D.faq=collectFaq(); D.faq.push(['New question','Answer']); saveD(); }catch(e){ toast(e.message); } render(true); }
function faqDel(i){ try{ need(); if(!confirm('Delete this question?')) return; D.faq=collectFaq(); D.faq.splice(i,1); saveD(); }catch(e){ toast(e.message); } render(true); }
function faqMove(i,d){ try{ need(); const a=collectFaq(), j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; D.faq=a; saveD(); }catch(e){ toast(e.message); } render(true); }
function dl(name,type,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
function exportJson(){ try{ need(); dl('bba-guide-data-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(D,null,1)); toast('Data file downloaded.'); }catch(e){ toast(e.message); } }
function parseData(t){ t=String(t).replace(/^\uFEFF/,''); const m=t.match(/const BAKED=(\{[\s\S]*?\});\/\*END\*\//); return JSON.parse(m?m[1]:t); }
function applyImport(text){ try{ need(); } catch(e){ return toast(e.message); } try{ const s=parseData(text); if(!s||typeof s!=='object'||!s.f||!s.tx) throw 0; if(!confirm('Replace the current content with this data?')) return; const d=clone(DEFAULTS); merge(d,s); D=deepClean(d); saveD(); render(); toast('Data imported.'); }catch(e){ toast('This is not a valid data file or saved page. Nothing was changed.'); } }
function importJson(inp){ const file=inp.files[0]; inp.value=''; if(!file) return; if(file.size>3e6) return toast('That file is too large.'); const r=new FileReader(); r.onload=()=>applyImport(r.result); r.onerror=()=>toast('Could not read that file. Paste the data in the box instead.'); r.readAsText(file); }
function importPaste(){ applyImport($('#imt').value); }
function copyData(){ try{ need(); copyText(JSON.stringify(D)); }catch(e){ toast(e.message); } }
function resetAll(){ try{ need(); if(!confirm('Erase all edits made in this browser and return to the saved version of the page?')) return; store.del('bba_data'); D=loadD(); render(); toast('Edits cleared.'); }catch(e){ toast(e.message); } }
function publish(cp){ try{ need(); const root=document.documentElement.cloneNode(true); root.removeAttribute('data-theme'); root.querySelector('#main').innerHTML=''; root.querySelector('#nav').innerHTML=''; root.querySelector('#ban').innerHTML=''; root.querySelector('#sub').innerHTML=''; root.querySelector('#foot').innerHTML=''; const cb=root.querySelector('#callbox'); if(cb) cb.remove();
  const sc=[...root.querySelectorAll('script')].pop(), json=JSON.stringify(D).replace(/</g,'\\u003c'); sc.textContent=sc.textContent.replace(/const BAKED=[\s\S]*?;\/\*END\*\//,()=>'const BAKED='+json+';/*END*/');
  const out='<!DOCTYPE html>\n'+root.outerHTML; if(cp){ copyText(out); return; } dl('BBA-Admission-Guide.html','text/html',out); toast('Updated page downloaded. If nothing downloaded, use Copy page code and paste it into a file named index.html.'); }catch(e){ toast(e.message); } }
const fld=(k,l,t,v)=>`<label>${esc(l)}<input id="af-${k}" ${t==='date'?'type="date"':t==='time'?'type="time"':t==='num'||t==='int'?'type="number" min="0" step="any"':'type="text"'} value="${esc(v)}"></label>`;
function adminHtml(){
 const r=pinRec();
 if(!ADMIN_OK) return `<h2>Admin</h2><div class="card">${r?`<p>Enter the Admin PIN to edit this page.</p><div class="form"><input id="pn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Admin PIN" aria-label="Admin PIN" onkeydown="if(event.key==='Enter')pinTry()"></div><button onclick="pinTry()">Unlock</button>`:`<p>No PIN is set yet. Create one to protect the editor. Use 4 to 8 digits and write it down: it cannot be recovered.</p><div class="form"><input id="p1" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN" aria-label="New PIN"><input id="p2" type="password" inputmode="numeric" maxlength="8" placeholder="Repeat PIN" aria-label="Repeat PIN"></div><button onclick="pinCreate()">Create PIN</button>`}</div>`;
 let body='';
 if(FIELDS[SUB]) body=`<div class="form">${FIELDS[SUB].map(r=>fld(r[0],r[1],r[2],f()[r[0]])).join('')}</div><button onclick="saveFields('${SUB}')">Save ${SUB}</button>`+(SUB==='Dates & Fees'?'<p class="note">Dates and amounts flow into every page, the FAQ and the countdown. In any text you can use placeholders such as {deadline}, {testDate}, {testTime}, {resultDate}, {venue}, {applyFee}, {total}, {sem1}, {semRest}, {minEach}, {direct}, {session} and {updated}.</p>':'');
 else if(SUB==='Lists') body=Object.keys(LISTS).map(k=>`<h3>${esc(LISTS[k][0])}</h3><p class="note">One line per row. Format: ${esc(LISTS[k][1])}</p><textarea id="al-${k}" rows="${D[k].length+2}" spellcheck="false">${esc(D[k].map(r=>r.join(' | ')).join('\n'))}</textarea>`).join('')+'<button onclick="saveLists()">Save all lists</button>';
 else if(SUB==='FAQ') body=`<p class="note">Edit, reorder or delete. Wrap key words in **double stars** to highlight them. Placeholders like {total} stay up to date.</p>${D.faq.map((r,i)=>`<div class="faqrow"><label>Question ${i+1}<input id="fqq${i}" value="${esc(r[0])}"></label><label>Answer<textarea id="fqa${i}" rows="3">${esc(r[1])}</textarea></label><div class="hbtn" style="margin-top:6px"><button class="ghost" onclick="faqMove(${i},-1)" aria-label="Move up">Up</button><button class="ghost" onclick="faqMove(${i},1)" aria-label="Move down">Down</button><button class="danger" onclick="faqDel(${i})">Delete</button></div></div>`).join('')}<div class="hbtn"><button onclick="saveFaq()">Save FAQ</button><button class="ghost" onclick="faqAdd()">Add a question</button></div>`;
 else if(SUB==='Page Text') body=`<p class="note">Plain text. Wrap key words in **double stars** to show them bold and highlighted. Placeholders like {deadline} fill in from Dates &amp; Fees.</p>`+TXF.map(([k,l,n])=>`<label>${esc(l)}<textarea id="at-${k}" rows="${n+1}">${esc(D.tx[k])}</textarea></label>`).join('')+'<br><button onclick="saveText()">Save page text</button>';
 else if(SUB==='Labels & Headings') body=`<p class="note">Change the title, tab names, page headings and other fixed wording. Wrap key words in **double stars** where a note says so.</p>`+UIDEF.map(([k,l,d,n])=>`<label>${esc(l)}<textarea id="au-${k}" rows="${n+1}" style="min-height:0">${esc(D.ui[k])}</textarea></label>`).join('')+'<br><button onclick="saveUi()">Save labels</button>';
 else if(SUB==='Fixed Text') body=`<p class="note">Every fixed heading, button, table heading and form label on the public pages. The grey text is the original; type your wording in the box. Clear a box to go back to the original.</p>`+FIXED.map((o,i)=>`<label><small style="opacity:.7">${esc(o)}</small><input id="ax-${i}" value="${esc(D.ui2[o]||o)}" maxlength="200"></label>`).join('')+'<br><button onclick="saveFixed()">Save fixed text</button>';
 else if(SUB==='Extra Pages') body=`<p class="note">Add your own pages (for example Scholarships or Campus Life). Each one becomes a new tab. Use **double stars** for key words; placeholders like {deadline} work.</p>${D.pages.map((r,i)=>`<div class="faqrow"><label>Page title<input id="pt${i}" value="${esc(r[0])}"></label><label>Text<textarea id="pb${i}" rows="5">${esc(r[1])}</textarea></label><div class="hbtn" style="margin-top:6px"><button class="ghost" onclick="pagesOp('up',${i})">Up</button><button class="ghost" onclick="pagesOp('down',${i})">Down</button><button class="danger" onclick="pagesOp('del',${i})">Delete</button></div></div>`).join('')}<div class="hbtn"><button onclick="pagesOp('save')">Save pages</button><button class="ghost" onclick="pagesOp('add')">Add a page</button></div>`;
 else body=`<div class="card"><h3 style="margin-top:0">Publish your edits</h3><p>Edits are saved in <b>this browser only</b>. Visitors see them only after you <b>download the updated page</b> and upload it to your website, replacing the old file.</p><div class="hbtn"><button onclick="publish()">Download updated page</button><button class="ghost" onclick="publish(true)">Copy page code</button></div></div>
 <div class="card"><h3 style="margin-top:0">Backup</h3><div class="hbtn"><button class="ghost" onclick="exportJson()">Export data file</button><label class="btn ghost" for="imp">Import data file</label><input type="file" id="imp" accept=".json,.html,.htm,application/json,text/html" style="position:absolute;width:1px;height:1px;opacity:0" onchange="importJson(this)"><button class="ghost" onclick="copyData()">Copy data</button></div><p class="note">Choose a data file (.json) or a page you saved earlier (.html). If the file picker does not work in your viewer, copy the data, then paste it here:</p><textarea id="imt" rows="3" placeholder="Paste data here" spellcheck="false"></textarea><button class="ghost" onclick="importPaste()">Import pasted data</button></div>
 <div class="card"><h3 style="margin-top:0">Change PIN</h3><div class="form"><input id="n1" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN" aria-label="New PIN"><input id="n2" type="password" inputmode="numeric" maxlength="8" placeholder="Repeat new PIN" aria-label="Repeat new PIN"></div><button onclick="pinChange()">Change PIN</button></div>
 <div class="card"><h3 style="margin-top:0">Reset</h3><button class="danger" onclick="resetAll()">Clear edits made in this browser</button></div>
 <p class="note">Security note: the PIN keeps people from editing through this page, but this is a static file. It protects your edits, not the file itself. Anyone with a copy of the file could change their own copy, which does not change what other visitors see on your website.</p>`;
 return `<h2>Admin: edit this page</h2><div class="hbtn"><button class="ghost" onclick="lock()">Lock</button></div><div class="subtabs">${SUBS.map(s=>`<button class="${s===SUB?'on':''}" onclick="SUB='${s}';render()">${s}</button>`).join('')}</div>${body}`; }
V.Admin=adminHtml;

function saveUi(){ try{ need(); UIDEF.forEach(([k,l])=>{ const v=clip($('#au-'+k).value); if(!v) throw new Error('This cannot be empty: '+l); D.ui[k]=v; }); saveD(); toast('Saved.'); }catch(e){ toast(e.message); } render(true); }
function collectPages(){ return D.pages.map((_,i)=>{ const t=clip($('#pt'+i).value).replace(/['"\\]/g,''), b=clip($('#pb'+i).value); if(!t||!b) throw new Error('Page '+(i+1)+': title and text are both required.'); if(TABS.includes(t)||t==='Admin') throw new Error('Page '+(i+1)+': this title is used by a built-in page.'); return [t,b]; }); }
function pagesOp(op,i){ try{ need(); const a=collectPages(); if(op==='add') a.push(['New page '+(a.length+1),'Write the page text here.']); if(op==='del'){ if(!confirm('Delete this page?')) return; a.splice(i,1); } if(op==='up'||op==='down'){ const j=i+(op==='up'?-1:1); if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; } if(new Set(a.map(r=>r[0])).size!==a.length) throw new Error('Two pages have the same title.'); D.pages=a; saveD(); toast(op==='save'?'Pages saved.':'Done.'); }catch(e){ toast(e.message); } render(true); }
function pageView(){ const p=D.pages.find(r=>r[0]===TAB); if(!p){ TAB='Home'; return V.Home(); } return `<h2>${esc(p[0])}</h2><div class="card tx">${rich(p[1])}</div>`; }
function saveFixed(){ try{ need(); const m={}; FIXED.forEach((o,i)=>{ const v=clip($('#ax-'+i).value); if(v&&v!==o) m[o]=v; }); D.ui2=m; saveD(); toast('Saved.'); }catch(e){ toast(e.message); } render(true); }
function applyFixed(root){ const m=D.ui2; if(!root||!m||!Object.keys(m).length) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), ns=[]; while(w.nextNode()) ns.push(w.currentNode); ns.forEach(n=>{ const t=n.nodeValue.trim(); if(t&&m[t]) n.nodeValue=n.nodeValue.replace(t,()=>m[t]); }); root.querySelectorAll('[placeholder]').forEach(e=>{ const q=e.getAttribute('placeholder'); if(m[q]) e.setAttribute('placeholder',m[q]); }); }
let FX=false; new MutationObserver(()=>{ if(FX||TAB==='Admin') return; FX=true; applyFixed($('#main')); FX=false; }).observe($('#main'),{childList:true,subtree:true});
/* ================= calling and copying helpers ================= */
function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast(t.length>80?'Copied.':'Copied: '+t),()=>toast('Could not copy on this device.')); else toast('Copy is not available in this viewer.'); }
function callNow(n){ const p=intl(n); let moved=false; const h=()=>{ moved=true; }; addEventListener('blur',h,{once:true}); document.addEventListener('visibilitychange',h,{once:true}); setTimeout(()=>{ removeEventListener('blur',h); document.removeEventListener('visibilitychange',h); if(!moved) callHelp(p); },1800); }
function callHelp(p){ let b=$('#callbox'); if(!b){ b=document.createElement('div'); b.id='callbox'; b.className='card'; b.style.cssText='position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;width:min(92%,420px);box-shadow:0 8px 30px rgba(0,0,0,.4)'; document.body.appendChild(b); }
 b.innerHTML=`<b>The phone app did not open on this device.</b><p>Dial this number from your phone: <strong class="key">${esc(p)}</strong></p><div class="hbtn"><button onclick="copyText('${esc(p)}')">Copy number</button><a class="btn wa" href="${esc(waLink(U('waMsg'),p))}" ${ext}>Chat on WhatsApp</a><button class="ghost" onclick="this.closest('#callbox').remove()">Close</button></div>`; }
/* ================= shell ================= */
function go(t){ TAB=t; render(); window.scrollTo(0,0); }
function tick(){ const el=$('#cd'); if(!el) return; const ms=deadlineMs()-Date.now(); if(ms<=0){ el.innerHTML=''; $('#cdn').textContent='The application deadline ('+dShort(f().deadline)+') has passed.'; return; }
 const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60; el.innerHTML=[[d,'days'],[h,'hours'],[m,'minutes']].map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join(''); $('#cdn').innerHTML='Deadline: <strong class="key">'+dShort(f().deadline)+'</strong>. Do not wait for the last day, payment checking takes 24 to 72 hours.'; }
function render(keep){ const x=f(); $('#ban').innerHTML=rich(D.tx.banner)+' <a href="'+esc(x.infoUrl)+'" '+ext+'>Official page</a>'; $('#sub').textContent=U('subtitle')+' · '+x.session; $('#ttl').textContent=U('title'); document.title=U('title')+' – BAUET (Unofficial)'; $('#foot').textContent='Source last updated: '+x.updated+'.';
 $('#hfb').href=okUrl(x.fb)?x.fb:'#'; $('#fwa').href=waLink(U('waMsg')); $('#fmm').href=mmLink();
 const base=[...TABS,...D.pages.map(p=>p[0])], tabs=ADMIN_OK||TAB==='Admin'?[...base,'Admin']:base;
 $('#nav').innerHTML=tabs.map(t=>`<button role="tab" class="${t===TAB?'on':''}" aria-selected="${t===TAB}" onclick="go('${t}')">${esc(tabLabel(t))}</button>`).join('');
 const y=window.scrollY; $('#main').innerHTML=(V[TAB]||pageView)(); tick(); applyFixed(document.querySelector('.float')); const on=document.querySelector('nav .on'); if(on&&!keep) on.scrollIntoView({inline:'center',block:'nearest'}); if(keep) window.scrollTo(0,y); }
setInterval(tick,30000); render();
</script></body></html>
